<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #e4f2f8;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 350px;
      width: 100%;
      background: #F8F9FD;
      background: linear-gradient(0deg, rgb(255, 255, 255) 0%, rgb(244, 247, 251) 100%);
      border-radius: 40px;
      padding: 25px 35px;
      border: 5px solid rgb(255, 255, 255);
      box-shadow: rgba(133, 189, 215, 0.8784313725) 0px 30px 30px -20px;
      margin: 20px;
      box-sizing: border-box;
    }

    .heading {
      text-align: center;
      font-weight: 900;
      font-size: 26px;
      color: rgb(16, 137, 211);
    }

    .sub-text {
      text-align: center;
      font-size: 12px;
      color: #777;
      margin-top: 10px;
      line-height: 1.4;
    }

    .form {
      margin-top: 20px;
    }

    .form .input {
      width: 100%;
      background: white;
      border: none;
      padding: 15px 20px;
      border-radius: 20px;
      margin-top: 15px;
      box-shadow: #cff0ff 0px 10px 10px -5px;
      border-inline: 2px solid transparent;
      box-sizing: border-box;
    }

    .form .input::placeholder {
      color: rgb(170, 170, 170);
    }

    .form .input:focus {
      outline: none;
      border-inline: 2px solid #12B1D1;
    }

    .form .reset-button {
      display: block;
      width: 100%;
      font-weight: bold;
      background: linear-gradient(45deg, rgb(16, 137, 211) 0%, rgb(18, 177, 209) 100%);
      color: white;
      padding-block: 15px;
      margin: 20px auto 10px auto;
      border-radius: 20px;
      box-shadow: rgba(133, 189, 215, 0.8784313725) 0px 20px 10px -15px;
      border: none;
      transition: all 0.2s ease-in-out;
      cursor: pointer;
    }

    .form .reset-button:hover {
      transform: scale(1.03);
      box-shadow: rgba(133, 189, 215, 0.8784313725) 0px 23px 10px -20px;
    }

    .form .reset-button:active {
      transform: scale(0.95);
    }

    .back-to-login {
      display: block;
      text-align: center;
      margin-top: 15px;
    }

    .back-to-login a {
      font-size: 11px;
      color: #0099ff;
      text-decoration: none;
      font-weight: bold;
    }

    .back-to-login a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="heading">Reset Password</div>
    <div class="sub-text">Enter your email address and we'll send you a link to reset your password.</div>

    <form action="{{ url_for('forgot') }}" class="form" method="post">
      <input required class="input" type="email" name="email" id="email" placeholder="E-mail">
      <input class="reset-button" type="submit" value="Send Reset Link">
    </form>

    <div class="back-to-login">
      <a href="{{ url_for('login') }}">← Back to Sign In</a>
    </div>
  </div>

</body>
</html>
