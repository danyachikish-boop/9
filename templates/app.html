<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messenger</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #e4f2f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Главный контейнер мессенджера */
    .messenger-container {
      display: flex;
      width: 100%;
      max-width: 900px;
      height: 600px;
      background: #F8F9FD;
      background: linear-gradient(0deg, rgb(255, 255, 255) 0%, rgb(244, 247, 251) 100%);
      border-radius: 30px;
      border: 5px solid rgb(255, 255, 255);
      box-shadow: rgba(133, 189, 215, 0.878) 0px 30px 30px -20px;
      overflow: hidden;
    }

    /* Левая колонка — Список чатов */
    .sidebar {
      width: 320px;
      border-right: 2px solid #eef5f9;
      display: flex;
      flex-direction: column;
      background-color: rgba(255, 255, 255, 0.5);
    }

    .sidebar-header {
      padding: 20px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 12px;
    }

    .sidebar-header h2 {
      font-size: 22px;
      font-weight: 900;
      color: rgb(16, 137, 211);
    }

    .user-profile-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(45deg, rgb(16, 137, 211) 0%, rgb(18, 177, 209) 100%);
      color: white;
      display: grid;
      place-content: center;
      font-weight: bold;
      font-size: 14px;
      text-decoration: none;
      box-shadow: rgba(133, 189, 215, 0.8) 0px 10px 10px -5px;
    }

    .add-chat-btn {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, #12b1d1, #1089d3);
      color: #fff;
      font-size: 27px;
      line-height: 1;
      cursor: pointer;
      box-shadow: rgba(133, 189, 215, 0.8) 0 10px 10px -5px;
      transition: transform .2s, box-shadow .2s;
    }

    .add-chat-btn:hover { transform: translateY(-2px) scale(1.08); box-shadow: rgba(16, 137, 211, .4) 0 12px 16px -5px; }

    .modal {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(19, 67, 91, .35);
      z-index: 10;
    }

    .modal[hidden] { display: none; }

    .modal-card {
      width: min(100%, 360px);
      padding: 26px;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 24px 60px rgba(16, 91, 125, .25);
    }

    .modal-card h3 { color: #1089d3; margin-bottom: 8px; }
    .modal-card p { color: #888; font-size: 13px; margin-bottom: 18px; }
    .friend-input {
      width: 100%;
      margin-bottom: 10px;
      padding: 12px 14px;
      border: 1px solid #dcecf4;
      border-radius: 12px;
      outline: none;
    }
    .friend-input:focus { border-color: #12b1d1; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
    .modal-actions button { border: 0; border-radius: 12px; padding: 10px 16px; cursor: pointer; font-weight: bold; }
    .cancel-btn { background: #eef5f9; color: #66808d; }
    .create-btn { background: linear-gradient(45deg, #1089d3, #12b1d1); color: #fff; }

    .search-box {
      padding: 0 20px 15px 20px;
    }

    .search-input {
      width: 100%;
      background: white;
      border: none;
      padding: 10px 15px;
      border-radius: 15px;
      box-shadow: #cff0ff 0px 8px 8px -4px;
      font-size: 13px;
      outline: none;
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .chat-item {
      display: flex;
      align-items: center;
      padding: 12px;
      border-radius: 18px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 5px;
    }

    .chat-item:hover, .chat-item.active {
      background-color: #ffffff;
      box-shadow: #cff0ff 0px 8px 12px -4px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #1089d3;
      color: white;
      display: grid;
      place-content: center;
      font-weight: bold;
      margin-right: 12px;
      flex-shrink: 0;
    }

    .chat-info {
      flex: 1;
      overflow: hidden;
    }

    .chat-name {
      font-size: 14px;
      font-weight: bold;
      color: #333;
    }

    .chat-last-msg {
      font-size: 12px;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    /* Правая колонка — Активный чат */
    .chat-window {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }

    .chat-header {
      padding: 15px 20px;
      border-bottom: 2px solid #f4f7fb;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-header-info {
      display: flex;
      align-items: center;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #9ca3af;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }

    .status-text {
      font-size: 11px;
      color: #888;
    }

    .empty-state {
      padding: 30px 15px;
      text-align: center;
      color: #888;
      font-size: 13px;
    }

    /* Область сообщений */
    .messages-area {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #fdfdfd;
    }

    .message-bubble {
      max-width: 65%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 13px;
      line-height: 1.4;
      position: relative;
    }

    .message-bubble.incoming {
      align-self: flex-start;
      background-color: #f0f4f8;
      color: #333;
      border-bottom-left-radius: 4px;
    }

    .message-bubble.outgoing {
      align-self: flex-end;
      background: linear-gradient(45deg, rgb(16, 137, 211) 0%, rgb(18, 177, 209) 100%);
      color: #bfefff;
      border-bottom-right-radius: 4px;
      box-shadow: rgba(133, 189, 215, 0.5) 0px 8px 10px -4px;
    }

    .message-time {
      font-size: 9px;
      opacity: 0.7;
      margin-top: 4px;
      text-align: right;
    }

    /* Поле ввода сообщения */
    .input-area {
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: #ffffff;
      border-top: 2px solid #f4f7fb;
    }

    .msg-input {
      flex: 1;
      background: #f4f7fb;
      color: #1089d3;
      border: none;
      padding: 12px 18px;
      border-radius: 20px;
      font-size: 13px;
      outline: none;
    }

    .send-btn {
      background: linear-gradient(45deg, rgb(16, 137, 211) 0%, rgb(18, 177, 209) 100%);
      color: white;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-content: center;
      cursor: pointer;
      box-shadow: rgba(133, 189, 215, 0.8) 0px 10px 10px -5px;
      transition: transform 0.2s;
    }

    .send-btn:hover {
      transform: scale(1.08);
    }

    .send-btn svg {
      width: 16px;
      height: 16px;
      fill: white;
    }
  </style>
</head>
<body>

  <div class="messenger-container">
    <!-- Сайдбар -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>Chats</h2>
        <button class="add-chat-btn" id="addChatBtn" type="button" title="Добавить чат" aria-label="Добавить чат">+</button>
        <a href="deactivate.html" class="user-profile-btn" title="Настройки / Деактивация">ME</a>
      </div>

      <div class="search-box">
        <input type="text" class="search-input" placeholder="Search chats...">
      </div>

      <div class="chat-list">
      </div>
    </div>

    <!-- Окно переписки -->
    <div class="chat-window">
      <div class="chat-header">
        <div class="chat-header-info">
          <div class="avatar">Alex</div>
          <div>
            <div class="chat-name">Alex Developer</div>
            <span class="status-dot"></span><span class="status-text">offline</span>
          </div>
        </div>
      </div>

      <!-- Сообщения -->
      <div class="messages-area" id="messagesArea">
      </div>

      <!-- Ввод сообщения -->
      <form class="input-area" id="chatForm">
        <input type="text" class="msg-input" id="messageInput" placeholder="Type a message..." required autocomplete="off">
        <button type="submit" class="send-btn">
          <svg viewBox="0 0 24 24">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
          </svg>
        </button>
      </form>
    </div>
  </div>

  <div class="modal" id="addChatModal" hidden>
    <form class="modal-card" id="addChatForm">
      <h3>Новый чат</h3>
      <p>Добавьте друга по нику и Gmail.</p>
      <input class="friend-input" id="friendNickname" type="text" placeholder="Ник друга" required maxlength="30">
      <input class="friend-input" id="friendEmail" type="email" placeholder="friend@gmail.com" required>
      <div class="modal-actions">
        <button class="cancel-btn" id="cancelAddChat" type="button">Отмена</button>
        <button class="create-btn" type="submit">Добавить</button>
      </div>
    </form>
  </div>

  <script>
    // Простая логика отправки сообщений
    const form = document.getElementById('chatForm');
    const input = document.getElementById('messageInput');
    const messagesArea = document.getElementById('messagesArea');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const msgDiv = document.createElement('div');
      msgDiv.className = 'message-bubble outgoing';
      // Используем textContent, чтобы введённый текст не мог выполнить HTML/скрипт.
      msgDiv.append(document.createTextNode(text));
      const timeElement = document.createElement('div');
      timeElement.className = 'message-time';
      timeElement.textContent = time;
      msgDiv.appendChild(timeElement);

      messagesArea.appendChild(msgDiv);
      input.value = '';
      messagesArea.scrollTop = messagesArea.scrollHeight;
    });

    // Быстрый поиск по списку чатов.
    const searchInput = document.querySelector('.search-input');
    const chatList = document.querySelector('.chat-list');
    const emptyState = document.createElement('div');
    emptyState.className = 'empty-state';
    emptyState.textContent = 'Чаты не найдены';

    searchInput.addEventListener('input', () => {
      const query = searchInput.value.trim().toLowerCase();
      let visibleCount = 0;

      const chatItems = [...chatList.querySelectorAll('.chat-item')];
      chatItems.forEach((chat) => {
        const matches = chat.textContent.toLowerCase().includes(query);
        chat.hidden = !matches;
        if (matches) visibleCount++;
      });

      emptyState.hidden = visibleCount !== 0;
      if (!emptyState.parentElement) chatList.appendChild(emptyState);
    });

    // Переключение активного чата без перезагрузки страницы.
    chatList.addEventListener('click', (e) => {
      const chat = e.target.closest('.chat-item');
      if (!chat) return;
      chatList.querySelectorAll('.chat-item').forEach((item) => item.classList.remove('active'));
      chat.classList.add('active');
    });

    const addChatBtn = document.getElementById('addChatBtn');
    const addChatModal = document.getElementById('addChatModal');
    const addChatForm = document.getElementById('addChatForm');
    const nicknameInput = document.getElementById('friendNickname');
    const emailInput = document.getElementById('friendEmail');

    addChatBtn.addEventListener('click', () => {
      addChatModal.hidden = false;
      nicknameInput.focus();
    });
    document.getElementById('cancelAddChat').addEventListener('click', () => addChatModal.hidden = true);
    addChatModal.addEventListener('click', (e) => { if (e.target === addChatModal) addChatModal.hidden = true; });
    addChatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const nickname = nicknameInput.value.trim();
      const email = emailInput.value.trim();
      const item = document.createElement('div');
      item.className = 'chat-item';
      item.innerHTML = `<div class="avatar"></div><div class="chat-info"><div class="chat-name"></div><div class="chat-last-msg"></div></div>`;
      item.querySelector('.avatar').textContent = nickname.slice(0, 2).toUpperCase();
      item.querySelector('.chat-name').textContent = nickname;
      item.querySelector('.chat-last-msg').textContent = email;
      chatList.prepend(item);
      addChatForm.reset();
      addChatModal.hidden = true;
    });
  </script>

</body>
</html>
