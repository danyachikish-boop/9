<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #e4f2f8;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 350px;
      width: 100%;
      background: #F8F9FD;
      background: linear-gradient(0deg, rgb(255, 255, 255) 0%, rgb(244, 247, 251) 100%);
      border-radius: 40px;
      padding: 25px 35px;
      border: 5px solid rgb(255, 255, 255);
      box-shadow: rgba(133, 189, 215, 0.8784313725) 0px 30px 30px -20px;
      margin: 20px;
      box-sizing: border-box;
    }

    .heading {
      text-align: center;
      font-weight: 900;
      font-size: 30px;
      color: rgb(16, 137, 211);
    }

    .form {
      margin-top: 20px;
    }

    .form .input {
      width: 100%;
      background: white;
      border: none;
      padding: 15px 20px;
      border-radius: 20px;
      margin-top: 15px;
      box-shadow: #cff0ff 0px 10px 10px -5px;
      border-inline: 2px solid transparent;
      box-sizing: border-box;
    }

    .form .input::placeholder {
      color: rgb(170, 170, 170);
    }

    .form .input:focus {
      outline: none;
      border-inline: 2px solid #12B1D1;
    }

    .form .register-button {
      display: block;
      width: 100%;
      font-weight: bold;
      background: transparent;
      color: #0099ff;
      padding-block: 15px;
      margin: 20px auto 10px auto;
      border-radius: 20px;
      border: 2px solid #00aee6;
      transition: all 0.2s ease-in-out;
      cursor: pointer;
    }

    .captcha {
      display: flex;
      justify-content: center;
      margin-top: 15px;
    }

    .form .register-button:hover {
      transform: scale(1.03);
      background: linear-gradient(45deg, rgb(16, 137, 211) 0%, rgb(18, 177, 209) 100%);
      color: white;
      box-shadow: rgba(133, 189, 215, 0.8784313725) 0px 10px 10px -8px;
    }

    .form .register-button:active {
      transform: scale(0.95);
    }

    .back-to-login {
      display: block;
      text-align: center;
      margin-top: 15px;
    }

    .back-to-login a {
      font-size: 11px;
      color: #0099ff;
      text-decoration: none;
      font-weight: bold;
    }

    .back-to-login a:hover {
      text-decoration: underline;
    }

    .agreement {
      display: block;
      text-align: center;
      margin-top: 15px;
    }

    .agreement a {
      text-decoration: none;
      color: #0099ff;
      font-size: 9px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="heading">Sign Up</div>

    <form action="{{ url_for('register') }}" class="form" id="registration-form" method="post">
      <input required class="input" type="text" name="username" id="username" placeholder="Username">
      <input required class="input" type="email" name="email" id="email" placeholder="E-mail">
      <input required class="input" type="password" name="password" id="password" placeholder="Password">
      <input required class="input" type="password" name="confirm_password" id="confirm_password" placeholder="Confirm Password">

      <div class="captcha">
        <div class="cf-turnstile" data-sitekey="1x00000000000000000000AA"></div>
      </div>

      <input class="register-button" type="submit" value="Create Account">
    </form>

    <div class="back-to-login">
      Already have an account? <a href="{{ url_for('login') }}">Sign In</a>
    </div>

    <span class="agreement"><a href="{{ url_for('licence') }}">Learn user licence agreement</a></span>
  </div>

  <script>
    document.getElementById('registration-form').addEventListener('submit', function (event) {
      const captchaResponse = this.querySelector('[name="cf-turnstile-response"]');

      if (!captchaResponse || !captchaResponse.value) {
        event.preventDefault();
        alert('Please complete the CAPTCHA.');
      }
    });
  </script>

</body>
</html>
